<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Runestone{% endblock %}</title>
    
    <!-- Modern Fonts -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161b22' stroke='%2330363d' stroke-width='1.2'/%3E%3Cpath d='M10.5 6.5V25.5M10.5 7.8L19.5 13L10.5 18M10.5 18L19.5 25.5' stroke='%233fb950' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet"/>
    
    <!-- Base & Theme Stylesheet -->
    <style>
        :root {
            --ground: #0d1117;
            --surface: #161b22;
            --surface-hover: #1c2128;
            --raised: #21262d;
            --border: #30363d;
            --border-muted: #21262d;
            --text: #f0f6fc;
            --muted: #8b949e;
            --subtle: #6e7681;
            --accent: #2ea043;
            --accent-hover: #3fb950;
            --accent-subtle: rgba(46, 160, 67, 0.15);
            --accent-line: #388bfd;
            --positive: #3fb950;
            --positive-bg: #12261b;
            --positive-border: #234b31;
            --negative: #f85149;
            --negative-bg: #2d181c;
            --negative-border: #52252a;
            --warning: #d29922;
            --warning-bg: #2b2315;
            --code-bg: #0b0e14;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--ground);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--ground);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Top Bar Shell */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 52px;
            background-color: var(--ground);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-brand-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--text);
            text-transform: uppercase;
        }

        .brand-rune-glyph {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            border-radius: var(--radius-sm);
            transition: transform 0.15s ease;
        }
        .brand-link:hover .brand-rune-glyph {
            transform: scale(1.05);
        }

        .repo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted);
            transition: border-color 0.15s, color 0.15s;
        }
        .repo-badge:hover {
            border-color: var(--accent-hover);
            color: var(--text);
        }
        .repo-badge .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-hover);
        }

        .header-nav {
            display: flex;
            align-items: center;
            height: 100%;
            gap: 4px;
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 52px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-item:hover {
            color: var(--text);
        }
        .nav-item.active {
            color: var(--text);
            border-bottom-color: var(--accent-hover);
        }
        .nav-item .material-symbols-outlined {
            font-size: 17px;
        }

        .header-utilities {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quick-filter-box {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 10px;
            gap: 6px;
            width: 220px;
            transition: border-color 0.15s;
        }
        .quick-filter-box:focus-within {
            border-color: var(--accent-hover);
        }
        .quick-filter-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 12px;
            width: 100%;
        }
        .quick-filter-box input::placeholder {
            color: var(--muted);
        }
        .kbd-hint {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            background-color: var(--raised);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            line-height: 1;
        }

        /* Main Canvas Layout */
        .app-canvas {
            flex: 1;
            width: 100%;
            max-width: 1360px;
            margin: 0 auto;
            padding: 24px 32px 48px;
        }

        @media (max-width: 768px) {
            .app-header {
                padding: 0 16px;
            }
            .app-canvas {
                padding: 16px;
            }
            .quick-filter-box {
                width: 140px;
            }
        }

        /* Common Component Tokens */
        .panel {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .panel-header {
            padding: 10px 16px;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.02em;
        }
        .panel-body {
            padding: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .btn:hover {
            background-color: var(--raised);
            border-color: var(--muted);
        }
        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .sha-tag {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-hover);
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 2px 7px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .sha-tag:hover {
            border-color: var(--accent-hover);
            background-color: var(--raised);
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .tag-positive {
            background-color: var(--positive-bg);
            color: var(--positive);
            border: 1px solid var(--positive-border);
        }
        .tag-negative {
            background-color: var(--negative-bg);
            color: var(--negative);
            border: 1px solid var(--negative-border);
        }
        .tag-warning {
            background-color: var(--warning-bg);
            color: var(--warning);
            border: 1px solid var(--border);
        }

        /* Footer */
        .app-footer {
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            background-color: var(--ground);
        }
        .app-footer-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-footer-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        /* Toast feedback */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            pointer-events: none;
        }
        .toast {
            background-color: var(--raised);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 12px;
            margin-top: 8px;
            animation: toast-in 0.2s ease-out;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="header-brand-cluster">
            <a href="/commits" class="brand-link" title="Runestone Local Git Engine">
                <svg class="brand-rune-glyph" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
                    <rect width="24" height="24" rx="5.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
                    <path d="M8 4.5V19.5M8 5.5L15 9.5L8 13.5M8 13.5L15.5 19.5" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
                    <path d="M8 4.5V19.5M8 5.5L15 9.5L8 13.5M8 13.5L15.5 19.5" stroke="var(--accent-hover)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Runestone</span>
            </a>
            
            <a href="/refs" class="repo-badge" title="Active Repository & Branch">
                <span class="status-dot"></span>
                <span>{{ repo_name }}</span>
                <span style="color: var(--accent-hover);">{% block branch_name %}[HEAD]{% endblock %}</span>
            </a>
        </div>

        <nav class="header-nav">
            <a href="/commits" class="nav-item {% block nav_commits %}{% endblock %}">
                <span class="material-symbols-outlined">history</span>
                <span>Commits</span>
            </a>
            <a href="/tree" class="nav-item {% block nav_tree %}{% endblock %}">
                <span class="material-symbols-outlined">folder_open</span>
                <span>Files</span>
            </a>
            <a href="/refs" class="nav-item {% block nav_refs %}{% endblock %}">
                <span class="material-symbols-outlined">fork_right</span>
                <span>Branches</span>
            </a>
        </nav>

        <div class="header-utilities">
            <div class="quick-filter-box" title="Filter items on this view (Press /)">
                <span class="material-symbols-outlined" style="font-size: 16px; color: var(--muted);">search</span>
                <input id="global-filter" type="text" placeholder="Filter..." autocomplete="off"/>
                <span class="kbd-hint">/</span>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="app-canvas">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="app-footer">
        <div class="app-footer-left">
            <span style="font-weight: 500; color: var(--text);">Runestone</span>
            <span>&bull;</span>
            <span>Local Git Inspection Engine</span>
        </div>
        <div class="app-footer-right">
            <span style="color: var(--subtle);">{{ repo_path }}</span>
            <span>&bull;</span>
            <span style="color: var(--accent-hover); display: flex; align-items: center; gap: 4px;">
                <span style="width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent-hover);"></span>
                HEAD
            </span>
        </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script>
        // Copy to clipboard helper with toast feedback
        function copyText(text, label) {
            navigator.clipboard.writeText(text).then(function() {
                showToast(label ? (label + ' copied') : 'Copied: ' + text);
            }).catch(function() {
                showToast('Failed to copy');
            });
        }

        function showToast(message) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.2s';
                setTimeout(function() { toast.remove(); }, 200);
            }, 2000);
        }

        // Global keyboard shortcut '/' to focus search filter
        document.addEventListener('keydown', function(e) {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                var search = document.getElementById('global-filter');
                if (search) search.focus();
            }
        });
    </script>
</body>
</html>
