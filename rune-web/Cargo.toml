[package]
name = "rune-web"
version = "0.1.0"
edition = "2021"

[dependencies]
rune-core = { path = "../rune-core" }
axum = "0.7.4"
tokio = { version = "1.36.0", features = ["full"] }
askama = "0.12.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
syntect = "5.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = "0.5.3"
