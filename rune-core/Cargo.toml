[package]
name = "rune-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
zstd = "0.13"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
hex = "0.4"
similar = "2.5"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
object_store = { version = "0.14", features = ["gcp"] }
bytes = "1.5"
futures = "0.3"
toml = "0.8"
ignore = "0.4.33"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.8"
